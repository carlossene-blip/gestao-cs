<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gestão C&amp;S</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; font: 15px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #f6f5f2; color: #222; }
  @media (prefers-color-scheme: dark) { body { background: #151515; color: #eee; } }
  p { padding: 0 16px; text-align: center; }
</style>
</head>
<body>
<p id="msg">Carregando…</p>
<script>
// Este arquivo é só a "casca" do site. A página de verdade fica no Apps Script da planilha
// (Código.gs → DASHBOARD_HTML) e é baixada a cada abertura. Assim, para mudar o site basta
// mudar o Apps Script: este arquivo do GitHub não precisa ser trocado de novo.
var API = 'https://script.google.com/macros/s/AKfycbzgWm0oKhqOyYmhIty8eI6rWlNzADNi9D9fT3BQJByND60i8m-iSpbYbJDJTbZDmG4/exec';
function abre(html) {
  document.open();
  document.write(html.split('__API_URL__').join(API));
  document.close();
}
fetch(API, {
  method: 'POST', credentials: 'omit', cache: 'no-store',
  headers: {'Content-Type': 'text/plain;charset=utf-8'},
  body: JSON.stringify({acao: 'pagina'})
}).then(function (r) {
  if (!r.ok) throw new Error('a planilha respondeu ' + r.status);
  return r.text();
}).then(function (html) {
  if (html.indexOf('<html') < 0) throw new Error('resposta inesperada da planilha');
  try { localStorage.setItem('gcs_pagina', html); } catch (e) {}
  abre(html);
}).catch(function (e) {
  var copia = null;
  try { copia = localStorage.getItem('gcs_pagina'); } catch (_) {}
  if (copia) abre(copia);   // sem conexão com a planilha: abre a última versão guardada neste aparelho
  else document.getElementById('msg').textContent = 'Não consegui abrir o site (' + e.message + '). Tente de novo em instantes.';
});
</script>
</body>
</html>
